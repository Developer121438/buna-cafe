<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Buna Café</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/Images/phone.png" />
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lovers+Quarrel&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header>
      <div class="header">
        <div class="logo">
          <img src="/Images/coffee-icon.png" alt="Buna Café logo" />
          <p>Buna Café</p>
        </div>

        <nav>
          <button
            class="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
          >
            ☰
          </button>

          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <hr />
    <!-- ================= MAIN ================= -->

    <main>
      <h1>GET IN TOUCH!</h1>
      <p>We'd love to hear from you.</p>
      <form id="contactForm">
        <label for="name"> Name </label>

        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          required
        />

        <label for="email"> Email </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />

        <label for="subject">Subject</label>

        <select id="subject" name="subject" required>
          <option value="" disabled selected>Select a subject</option>

          <option value="general-question">General Question</option>

          <option value="reservation">Reservation Request</option>

          <option value="menu">Question About the Menu</option>

          <option value="catering">Catering Inquiry</option>

          <option value="feedback">Feedback</option>

          <option value="event">Private Event</option>

          <option value="other">Other</option>
        </select>

        <label for="message"> Message </label>

        <textarea
          id="message"
          name="message"
          rows="6"
          placeholder="Write your message here..."
          required
        ></textarea>

        <button type="submit">Send Message</button>
      </form>

      <p id="formMessage"></p>
    </main>

    <hr />

    <!-- ================= FOOTER ================= -->

    <footer>
      <div class="footer-contact">
        <p>
          <img src="/Images/location.png" alt="Location" />

          Papires, Bahir Dar
        </p>

        <p>
          <a href="tel:+251908562615">
            <img src="/Images/phone.png" alt="Phone" />

            0908562615
          </a>
        </p>

        <p>
          <a href="mailto:dejenangaw277@gmail.com">
            <img src="/Images/mailbox.png" alt="Email" />

            dejenangaw277@gmail.com
          </a>
        </p>

        <p>
          <img src="/Images/watch icon.png" alt="Opening hours" />

          Monday - Sunday
          <br />

          2:30 AM - 7:30 AM
          <br />

          8:30 AM - 3:00 PM
        </p>
      </div>

      <div class="social-media">
        <a href="#" aria-label="Facebook">
          <img src="/Images/facebook-icon.png" alt="Facebook" />
        </a>

        <a href="#" aria-label="Instagram">
          <img src="/Images/instagram-icon.png" alt="Instagram" />
        </a>

        <a href="#" aria-label="YouTube">
          <img src="/Images/youTube-icon.png" alt="YouTube" />
        </a>
      </div>

      <p class="copyright">&copy; 2026 Buna Café. All Rights Reserved.</p>
    </footer>
  </body>
</html>
